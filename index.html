<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maktab CRM - Xususiy Maktab Boshqaruv Tizimi</title>
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script type="module" crossorigin src="./assets/index-DdPjko7q.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CH0KesNj.css">
</head>
<body>
  <div class="app-layout">
    
    <!-- Mobile Top Navigation Header -->
    <header class="mobile-top-bar" id="mobile-top-bar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="mobile-menu-toggle" class="btn-close-modal" aria-label="Menyuni ochish" style="padding: 5px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div style="display: flex; align-items: center; gap: 6px;">
          <div class="brand-icon" style="width: 28px; height: 28px; font-size: 14px; border-radius: 8px;">M</div>
          <span style="font-weight: 700; font-size: 14px; color: #ffffff; white-space: nowrap;">Maktab CRM</span>
        </div>
      </div>

      <!-- Right Controls: Language Switcher, Dark/Light Mode, User Profile -->
      <div style="display: flex; align-items: center; gap: 6px;">
        <!-- Language Switcher Button -->
        <button id="mobile-lang-btn" class="header-action-pill" title="Tilni almashtirish / Сменить язык" aria-label="Til">
          <span class="lang-text" style="font-size: 11px; font-weight: 700;">UZ</span>
        </button>

        <!-- Dark / Light Theme Toggle Button -->
        <button id="mobile-theme-btn" class="header-action-pill" title="Qorong'u / Yorug' rejim" aria-label="Rejim">
          <span class="theme-icon" style="font-size: 13px;">🌙</span>
        </button>

        <span class="user-avatar" style="width: 28px; height: 28px; font-size: 11px;">DR</span>
      </div>
    </header>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Desktop & Tablet Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div>
        <div class="sidebar-brand" id="brand-logo-btn">
          <div class="brand-icon">M</div>
          <div class="brand-text">
            <h1>Maktab CRM</h1>
            <span>Xususiy maktab</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <button class="nav-item" data-tab="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Boshqaruv paneli</span>
          </button>

          <button class="nav-item active" data-tab="leads">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
            <span>Qabul (leadlar)</span>
          </button>

          <button class="nav-item" data-tab="students">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>O'quvchilar</span>
          </button>

          <button class="nav-item" data-tab="classes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
            <span>Sinflar va o'qituvchilar</span>
          </button>

          <button class="nav-item" data-tab="payments">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
              <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>
            <span>To'lovlar</span>
          </button>

          <button class="nav-item" data-tab="attendance">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Davomat</span>
          </button>

          <button class="nav-item" data-tab="reports">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            <span>Hisobotlar</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-footer">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 4px;">
          <div style="display: flex; gap: 6px;">
            <button id="desktop-lang-btn" class="header-action-pill" title="Tilni almashtirish / Сменить язык" style="font-size: 11.5px; height: 30px; padding: 4px 10px;">
              <span class="lang-text" style="font-weight: 700;">UZ</span>
            </button>
            <button id="desktop-theme-btn" class="header-action-pill" title="Qorong'u / Yorug' rejim" style="font-size: 13px; height: 30px; padding: 4px 10px;">
              <span class="theme-icon">🌙</span>
            </button>
          </div>
          <span style="font-size: 11.5px; color: var(--text-light); font-weight: 500;">v1.2.0</span>
        </div>

        <div class="user-badge" id="profile-badge">
          <div class="user-avatar">DR</div>
          <div class="user-info">
            <span class="user-name">Direktor</span>
            <span class="user-role">Admin huquqi</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Container -->
    <main class="main-content" id="main-content">
      <!-- Dynamic View Container populated by JavaScript -->
      <div id="view-container"></div>
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
      <div class="mobile-bottom-nav-items">
        <button class="mobile-nav-btn" data-tab="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Asosiy</span>
        </button>

        <button class="mobile-nav-btn active" data-tab="leads">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
          <span>Qabul</span>
        </button>

        <button class="mobile-nav-btn" data-tab="students">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>O'quvchi</span>
        </button>

        <button class="mobile-nav-btn" data-tab="payments">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
            <line x1="1" y1="10" x2="23" y2="10"></line>
          </svg>
          <span>To'lovlar</span>
        </button>

        <button class="mobile-nav-btn" id="mobile-more-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="19" cy="12" r="1"></circle>
            <circle cx="5" cy="12" r="1"></circle>
          </svg>
          <span>Menyu</span>
        </button>
      </div>
    </nav>

  </div>

  <!-- Global Modal Host Container -->
  <div class="modal-backdrop" id="modal-container"></div>

  <!-- Toast Notification Host -->
  <div id="toast-container" style="position: fixed; bottom: 80px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none;"></div>

  <!-- Thermal POS Receipt Print Area (Visible only on @media print) -->
  <div id="receipt-print-area" aria-hidden="true"></div>

</body>
</html>
